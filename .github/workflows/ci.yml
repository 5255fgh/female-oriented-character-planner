name: CI

on:
  pull_request:
    branches:
      - integration/intelligent-v2
      - main
  push:
    branches:
      - integration/intelligent-v2
      - main

permissions:
  contents: read

jobs:
  verification:
    name: Node ${{ matrix.node }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Run smoke checks
        run: npm run smoke

      - name: Build production bundle
        run: npm run build
